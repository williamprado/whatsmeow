name: VoIP module

# The main "Go" workflow builds/tests the root module only; Go skips the nested
# voip/ companion module. This job builds, vets, and tests it (incl. the MLow
# codec golden vectors) and guards that its go.mod stays tidy.

on: [push, pull_request]

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    name: VoIP ${{ matrix.go-version == '1.26' && '(latest)' || '(old)' }}
    defaults:
      run:
        working-directory: voip
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
